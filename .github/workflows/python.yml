name: Python syntax
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp
      - run: python -m compileall -q custom_components/batocera
      - run: python -m unittest discover -s tests -v
      - run: bash -n development-assets/scripts/batocera_mdns
      - run: bash tests/test_mdns_display_name.sh
